[program:nex-oms-orders-import]
command=/bin/bash /var/www/nex-oms/scripts/start-queue-worker.sh /usr/bin/php /var/www/nex-oms/artisan queue:work database --queue=orders-import --sleep=3 --tries=1 --timeout=210 --max-time=3600
directory=/var/www/nex-oms
user=ubuntu
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=240
redirect_stderr=true
stdout_logfile=/var/log/supervisor/nex-oms-orders-import.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
